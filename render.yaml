services:
  - type: web
    name: run-route-backend
    env: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    previews:
      generation: automatic
      # Temporarily Starter (matching production) for a production-
      # equivalent PR-preview latency validation pass -- see PR #25.
      # Revisit after that pass: Free previews are cheaper and adequate
      # for correctness/CI, but are not representative for CPU-bound
      # performance benchmarking.
      plan: starter
    envVars:
      - key: ORS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Not a secret -- declared so the checked-in config reproduces the
      # dashboard-configured production value instead of silently
      # defaulting to "ors" (see app/main.py).
      - key: ROUTING_ENGINE
        value: local
